name: Full regression

# 完整回归独立运行，不阻塞 ci.yml 的发布门禁。
on:
  schedule:
    - cron: '17 19 * * *' # UTC；定时运行默认分支，GitHub 可能延迟调度。
  workflow_dispatch:

concurrency:
  group: yuanhub-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Frontend full regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full repository regression
        run: npm run test:all
