// Opt-in verification entry; does not alter the normal build or require private data in CI.
allprojects {
    afterEvaluate {
        tasks.register('panelSourceParity', JavaExec) {
            dependsOn tasks.named('testClasses')
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'com.lhs.share.hub.service.operator.PanelSourceParityCheck'
            doFirst { args project.property('panelBundle'), project.property('panelCases') }
        }
    }
}
