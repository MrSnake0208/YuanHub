name: Full regression

# 完整回归仅供手动诊断，不作为集中发布门禁，也不提供 reusable workflow。

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to diagnose
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-yuanhub-regression-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  regression:
    name: Frontend full regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full repository regression
        run: npm run test:all
