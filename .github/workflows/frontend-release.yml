name: Frontend release
run-name: Deploy ${{ inputs.tag }} [${{ inputs.request }}]

# 生产发布只接受 main 上明确确认的 dispatch，并验证集中检查的 SHA/版本。
# prepare dispatch 仅在同样门禁通过后预构建；版本来自发布参数。
#
# 普通 CI 继续使用 GitHub-hosted runner；Release 通过 SSH 驱动服务器 A：
#   服务器缓存源码 → checkout 精确 tag/commit → npm ci/build → 原子切换 current。
# 不再从 GitHub Runner SCP 整套 dist，避免大体积静态资源反复跨网传输。
#
# SSH 连接继续复用服务器 A 的既有凭据：
#   secrets.YUANHUB_PROMO_VPS_SSH_KEY / _HOST / _USER / _PORT
# 本应用专属 Variables：
#   YUANHUB_FRONTEND_DEPLOY_DIR / YUANHUB_FRONTEND_URL /
#   YUANHUB_FRONTEND_API_BASE
#
# 部署形态：
#   $YUANHUB_FRONTEND_DEPLOY_DIR/.source                  ← 服务器源码缓存
#   $YUANHUB_FRONTEND_DEPLOY_DIR/releases/<version>-<commit>/
#   $YUANHUB_FRONTEND_DEPLOY_DIR/current -> releases/<version>-<commit>
# Web 服务器（nginx 等）的 root 应指向 .../current。

on:
  workflow_dispatch:
    inputs:
      check_run:
        description: Successful concentrated release-check run ID
        required: true
      confirmation:
        description: "Explicit approval: deploy COMPONENT/vVERSION@FULL_SHA"
        required: true
      tag:
        description: "目标 tag（prepare 使用新 tag；release 使用已有 tag）"
        required: true
      phase:
        description: "prepare 仅构建；release 在 CI 成功后激活"
        type: choice
        options: [release, prepare]
        default: release
      commit:
        description: "冻结的 main 完整提交 SHA"
        required: false
      request:
        description: "prepare 请求唯一标识"
        required: false

concurrency:
  group: yuanhub-frontend-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ vars.YUANHUB_MONOREPO_DEPLOY_ENABLED == 'true' && github.actor == github.repository_owner }}
    name: Build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 与 promo 部署同一目标机；若给该 environment 配 Required reviewers，可让发布需人工批准。
    environment: frontend-production

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DEPLOY_PHASE: ${{ inputs.phase || 'release' }}
      REQUESTED_COMMIT: ${{ inputs.commit }}
      CHECK_RUN: ${{ inputs.check_run }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PREPARE_REQUEST: ${{ inputs.request }}

    steps:
      - name: Validate release request
        working-directory: .
        run: |
          set -eu
          [[ "$RELEASE_TAG" =~ ^frontend/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "::error::Invalid frontend tag"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Only main workflow dispatch is allowed"; exit 1; }
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CHECK_RUN" =~ ^[0-9]+$ ]] || exit 1
          [ "$CONFIRMATION" = "deploy $RELEASE_TAG@$REQUESTED_COMMIT" ] || { echo "Explicit deployment confirmation required"; exit 1; }
          case "$DEPLOY_PHASE" in prepare|release) ;; *) echo "::error::Invalid phase"; exit 1 ;; esac
          if [ "$DEPLOY_PHASE" = prepare ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::prepare must run from main"; exit 1; }
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::prepare requires a full SHA"; exit 1; }
            [[ "$RELEASE_TAG" =~ ^frontend/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "::error::Invalid prepare tag"; exit 1; }
            [[ "$PREPARE_REQUEST" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::Invalid prepare request"; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Validate prepared commit
        if: ${{ inputs.phase == 'prepare' }}
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$REQUESTED_COMMIT" ]
          git merge-base --is-ancestor "$REQUESTED_COMMIT" origin/main || {
            echo "::error::prepare commit must belong to main"; exit 1;
          }
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::prepare cannot overwrite an existing tag"; exit 1;
          fi

      - name: Resolve release version and commit
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$REQUESTED_COMMIT" ]
          git merge-base --is-ancestor "$REQUESTED_COMMIT" origin/main
          if [ "$DEPLOY_PHASE" = release ]; then
            [ "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$REQUESTED_COMMIT" ]
          fi
          echo "YUANHUB_VERSION=${RELEASE_TAG#frontend/v}" >> "$GITHUB_ENV"
          echo "YUANHUB_RELEASE_COMMIT=$REQUESTED_COMMIT" >> "$GITHUB_ENV"

      - name: Require concentrated release evidence
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
          DEPLOYMENT_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
          BACKEND_URL: ${{ vars.YUANHUB_BACKEND_URL }}
        run: |
          python3 -m scripts.release_gate --run "$CHECK_RUN" --commit "$REQUESTED_COMMIT" \
            --component frontend --version "${RELEASE_TAG#frontend/v}" --api-base "$API_BASE" --deployment-url "$DEPLOYMENT_URL" \
            --backend-url "$BACKEND_URL" --phase "$DEPLOY_PHASE"
          echo "CI_RUN_ID=$CHECK_RUN" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        env:
          FRONTEND_ROOT: ${{ vars.YUANHUB_FRONTEND_DEPLOY_DIR }}
          FRONTEND_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
          API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
          PROMO_ROOT: ${{ secrets.YUANHUB_PROMO_DEPLOY_DIR }}
        run: |
          set -eu
          test -n "$FRONTEND_ROOT" || { echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR is not configured"; exit 1; }
          test "$FRONTEND_ROOT" != "/" || { echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR must not be /"; exit 1; }
          case "$FRONTEND_ROOT" in
            /*) ;;
            *) echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR must be an absolute path"; exit 1 ;;
          esac
          test -n "$FRONTEND_URL" || { echo "::error::YUANHUB_FRONTEND_URL is not configured"; exit 1; }
          case "$FRONTEND_URL" in
            https://*) ;;
            *) echo "::error::YUANHUB_FRONTEND_URL must use https://"; exit 1 ;;
          esac
          test -n "$API_BASE" || { echo "::error::YUANHUB_FRONTEND_API_BASE is not configured"; exit 1; }
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::YUANHUB_FRONTEND_API_BASE must use https://"; exit 1 ;;
          esac
          if [ -n "$PROMO_ROOT" ] && [ "$FRONTEND_ROOT" = "$PROMO_ROOT" ]; then
            echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR must differ from YUANHUB_PROMO_DEPLOY_DIR"
            exit 1
          fi

      - name: Validate deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.YUANHUB_PROMO_VPS_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" || {
            echo "::error::YUANHUB_PROMO_VPS_SSH_KEY is empty or unavailable. It is the same secret used by promo-site-deploy.yml."
            exit 1
          }
          case "$DEPLOY_KEY" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*|"-----BEGIN RSA PRIVATE KEY-----"*) ;;
            *)
              echo "::error::YUANHUB_PROMO_VPS_SSH_KEY must contain the complete private key, including BEGIN and END lines."
              exit 1
              ;;
          esac
          key_file="$(mktemp)"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Build and activate release on server
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          FRONTEND_ROOT: ${{ vars.YUANHUB_FRONTEND_DEPLOY_DIR }}
          RELEASE_VERSION: ${{ env.YUANHUB_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_COMMIT: ${{ env.YUANHUB_RELEASE_COMMIT }}
          API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_PHASE: ${{ env.DEPLOY_PHASE }}
        with:
          host: ${{ secrets.YUANHUB_PROMO_VPS_HOST }}
          username: ${{ secrets.YUANHUB_PROMO_VPS_USER }}
          key: ${{ secrets.YUANHUB_PROMO_VPS_SSH_KEY }}
          port: ${{ secrets.YUANHUB_PROMO_VPS_PORT }}
          envs: FRONTEND_ROOT,RELEASE_VERSION,RELEASE_TAG,RELEASE_COMMIT,API_BASE,REPO_URL,DEPLOY_PHASE
          command_timeout: 30m
          script: |
            set -eu

            test -n "$FRONTEND_ROOT"
            test -n "$RELEASE_VERSION"
            test -n "$RELEASE_TAG"
            test -n "$RELEASE_COMMIT"
            test -n "$API_BASE"
            test -n "$REPO_URL"
            case "$DEPLOY_PHASE" in prepare|release) ;; *) echo "Invalid phase"; exit 1 ;; esac

            release_dir="$FRONTEND_ROOT/releases/$RELEASE_VERSION-$RELEASE_COMMIT"
            legacy_dir="$FRONTEND_ROOT/releases/$RELEASE_VERSION"
            if [ -f "$legacy_dir/deploy-meta.json" ] &&
               grep -qF "\"version\":\"$RELEASE_VERSION\"" "$legacy_dir/deploy-meta.json" &&
               grep -qF "\"commit\":\"$RELEASE_COMMIT\"" "$legacy_dir/deploy-meta.json"; then
              release_dir="$legacy_dir"
            fi
            meta_file="$release_dir/deploy-meta.json"
            expected_link="releases/$(basename "$release_dir")"
            export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=accept-new'
            mkdir -p "$FRONTEND_ROOT/releases"

            # 同一版本/commit 的准备或已发布产物直接复用，支持安全重跑。
            reuse_release=0
            if [ -f "$meta_file" ] &&
               [ -f "$release_dir/index.html" ] && [ -f "$release_dir/sw.js" ] &&
               [ -d "$release_dir/assets" ] && [ -n "$(ls -A "$release_dir/assets")" ] &&
               grep -qF "\"version\":\"$RELEASE_VERSION\"" "$meta_file" &&
               grep -qF "\"commit\":\"$RELEASE_COMMIT\"" "$meta_file"; then
              reuse_release=1
              # 新的准备产物绑定构建 API 地址；老的已发布 metadata 仍可安全重跑。
              if grep -q '"apiBase":' "$meta_file" &&
                 ! grep -qF "\"apiBase\":\"$API_BASE\"" "$meta_file"; then
                reuse_release=0
              fi
              if [ "$reuse_release" -eq 1 ]; then echo "Reusing existing release: $release_dir"; fi
            fi

            if [ "$reuse_release" -ne 1 ]; then
              if [ -e "$release_dir" ] || [ -L "$release_dir" ]; then
                echo "Refusing to replace existing release: $release_dir" >&2
                exit 1
              fi
              build_started="$(date +%s)"
              for tool in git node npm; do
                command -v "$tool" >/dev/null 2>&1 || {
                  echo "$tool is required on the deployment server"
                  exit 1
                }
              done

              node_major="$(node -p 'process.versions.node.split(".")[0]')"
              if [ "$node_major" != "22" ]; then
                echo "Node.js 22 is required on the deployment server; found $(node --version)"
                exit 1
              fi

              build_dir="$(mktemp -d "$FRONTEND_ROOT/.monorepo-build.XXXXXXXX")"
              trap 'rm -rf "$build_dir"' EXIT
              source_dir="$build_dir/source"
              git clone --filter=blob:none --no-checkout --reference-if-able "$FRONTEND_ROOT/.monorepo-source" "$REPO_URL" "$source_dir"
              cd "$source_dir"
              git checkout --detach "$RELEASE_COMMIT"

              actual_commit="$(git rev-parse HEAD)"
              if [ "$actual_commit" != "$RELEASE_COMMIT" ]; then
                echo "Checked-out commit $actual_commit does not match expected $RELEASE_COMMIT"
                exit 1
              fi

              cd frontend
              npm ci --no-audit --no-fund
              NODE_ENV=production YUANHUB_VERSION="$RELEASE_VERSION" VITE_API_BASE="$API_BASE" NODE_OPTIONS="--max-old-space-size=1152" npm run build

              node --input-type=module -e '
                import fs from "node:fs";
                const info = JSON.parse(fs.readFileSync("dist/build-info.json", "utf8"));
                if (info.productVersion !== process.env.RELEASE_VERSION || info.frontendCommit !== process.env.RELEASE_COMMIT) process.exit(1);
              '
              test -f dist/index.html || {
                echo "dist/index.html missing after server build"
                exit 1
              }
              test -n "$(ls -A dist/assets)" || {
                echo "dist/assets is empty after server build"
                exit 1
              }
              if ! grep -rqF "$RELEASE_VERSION" dist/assets; then
                echo "productVersion $RELEASE_VERSION missing from server build"
                exit 1
              fi

              stage_dir="$(mktemp -d "$FRONTEND_ROOT/releases/.${RELEASE_VERSION}.XXXXXXXX")"
              cp -a dist/. "$stage_dir/"
              test -f "$stage_dir/sw.js" || {
                echo "dist/sw.js missing after server build"
                exit 1
              }
              sw_sha256="$(sha256sum "$stage_dir/sw.js" | awk '{print $1}')"
              printf '{"version":"%s","tag":"%s","commit":"%s","swSha256":"%s","apiBase":"%s"}\n' \
                "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" "$sw_sha256" "$API_BASE" \
                > "$stage_dir/deploy-meta.json"

              active_target="$(readlink "$FRONTEND_ROOT/current" 2>/dev/null || true)"
              if [ "$active_target" = "$expected_link" ] && [ -d "$release_dir" ]; then
                echo "Refusing to replace the currently active release in place: $release_dir"
                exit 1
              fi

              mv -T -n "$stage_dir" "$release_dir"
              [ ! -d "$stage_dir" ] || { echo "Release appeared concurrently: $release_dir" >&2; exit 1; }
              echo "Frontend build seconds: $(( $(date +%s) - build_started ))"
            fi

            if [ "$DEPLOY_PHASE" = prepare ]; then
              echo "Prepared $RELEASE_VERSION ($RELEASE_COMMIT); current is unchanged."
              exit 0
            fi

            # 临时链接 + rename，保证 current 始终指向完整 release。
            switch_dir="$(mktemp -d "$FRONTEND_ROOT/.switch.XXXXXXXX")"
            if [ -L "$FRONTEND_ROOT/current" ]; then
              cp -P "$FRONTEND_ROOT/current" "$switch_dir/previous"
            elif [ -e "$FRONTEND_ROOT/current" ]; then
              echo "Refusing to replace non-symlink current" >&2; exit 1
            fi
            ln -s "$expected_link" "$switch_dir/current"
            mv -T "$switch_dir/current" "$FRONTEND_ROOT/current"
            echo "current -> $(readlink "$FRONTEND_ROOT/current")"

      - name: Health check
        if: ${{ inputs.phase != 'prepare' }}
        env:
          SITE_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
          EXPECTED_VERSION: ${{ env.YUANHUB_VERSION }}
          EXPECTED_COMMIT: ${{ env.YUANHUB_RELEASE_COMMIT }}
        run: |
          set -eu
          test -n "$SITE_URL" || { echo "::error::YUANHUB_FRONTEND_URL is not configured"; exit 1; }
          base="${SITE_URL%/}"
          sw_file="$(mktemp)"
          attempt=1
          while [ "$attempt" -le 10 ]; do
            payload="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${base}/deploy-meta.json?deploy=${EXPECTED_COMMIT}" || true)"
            version="$(printf '%s' "$payload" | jq -r '.version // ""' 2>/dev/null || true)"
            commit="$(printf '%s' "$payload" | jq -r '.commit // ""' 2>/dev/null || true)"
            expected_sw_sha="$(printf '%s' "$payload" | jq -r '.swSha256 // ""' 2>/dev/null || true)"
            actual_sw_sha=""
            : > "$sw_file"
            if [ -n "$expected_sw_sha" ] && curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              -o "$sw_file" \
              "${base}/sw.js?deploy=${EXPECTED_COMMIT}"; then
              actual_sw_sha="$(sha256sum "$sw_file" | awk '{print $1}')"
            fi
            if [ "$version" = "$EXPECTED_VERSION" ] &&
               [ "$commit" = "$EXPECTED_COMMIT" ] &&
               [ -n "$expected_sw_sha" ] &&
               [ "$actual_sw_sha" = "$expected_sw_sha" ]; then
              echo "Health check passed: version=$version commit=${commit::7} sw=${actual_sw_sha::12}"
              exit 0
            fi
            echo "Attempt $attempt: version='$version' commit='${commit:0:7}' expected_sw='${expected_sw_sha:0:12}' actual_sw='${actual_sw_sha:0:12}'"
            attempt=$((attempt + 1))
            sleep 6
          done
          echo "::error::Health check failed: $base is not serving a consistent version=$EXPECTED_VERSION commit=$EXPECTED_COMMIT and sw.js"
          exit 1

      - name: Create or update GitHub Release
        if: ${{ inputs.phase != 'prepare' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
        run: |
          set -eu
          notes="$(mktemp)"
          {
            echo "## YuanHub ${RELEASE_TAG}"
            echo
            echo "- productVersion: \`${YUANHUB_VERSION}\`"
            echo "- frontendCommit: \`${YUANHUB_RELEASE_COMMIT::7}\`"
            echo "- deployedTo: \`${FRONTEND_URL}\`"
            echo
            echo "更新日志见 ${FRONTEND_URL%/}/changelog"
          } > "$notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "YuanHub $RELEASE_TAG" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "YuanHub $RELEASE_TAG" \
              --notes-file "$notes" \
              --verify-tag
          fi
