name: Frontend CI

# 普通 push / PR 跑快速检查与构建；完整行为测试由 regression.yml 每日/手动运行。
# 生产发布由 tag 触发的 release.yml 负责。

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'backend/src/**'
      - '.github/**'
      - 'scripts/**'
      - 'dev.sh'
      - 'release.sh'
      - 'AGENTS.md'
      - 'docs/development/testing.md'
      - '.gitattributes'
      - '.gitignore'
  workflow_call:
    inputs:
      contract-only:
        description: Run only paired contracts for backend-only PR changes
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: yuanhub-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  build:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ inputs.contract-only }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up npm cache
        if: ${{ !inputs.contract-only }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ !inputs.contract-only }}
        run: npm ci

      # 复用仓库既有命令，不另建测试体系。
      - name: Static source check
        if: ${{ !inputs.contract-only }}
        run: npm run test:static

      # 这里只跑 YuanHub 仓库内可独立执行的 node:test。
      # 跨端契约由下方 test:contract 检查；test:all 仍只覆盖前端。
      - name: Repository tests
        if: ${{ !inputs.contract-only }}
        run: npm run test:repo

      - name: Paired API contract
        run: npm run test:contract

      - name: Build
        if: ${{ !inputs.contract-only }}
        env:
          NODE_ENV: production
        run: npm run build

      # 校验 VERSION / commit / buildTime 确实进入了构建产物，
      # 否则版本入口与 Feedback 诊断会在线上显示错误信息。
      - name: Verify injected build info
        if: ${{ !inputs.contract-only }}
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version" || { echo "::error::VERSION is empty"; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          if ! grep -rqF "$version" dist/assets; then
            echo "::error::productVersion $version was not found in the built assets"
            exit 1
          fi
          echo "Injected productVersion: $version"

      - name: Upload build output
        if: ${{ !inputs.contract-only }}
        uses: actions/upload-artifact@v4
        with:
          name: yuanhub-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 7
