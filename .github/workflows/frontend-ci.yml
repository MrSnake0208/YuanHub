name: Frontend CI

# 本工作流供手动或集中发布检查复用；Push/PR 轻量检查由 ci.yml 自动运行。

on:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ""
      release-version:
        type: string
        default: ""
      contract-only:
        description: Run only paired contracts for backend-only PR changes
        type: boolean
        default: false
      behavior:
        description: Run behavior tests for concentrated release checks
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to diagnose
        type: string
      release-version:
        description: Optional build version
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-yuanhub-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  build:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up Node
        if: ${{ inputs.contract-only }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up npm cache
        if: ${{ !inputs.contract-only }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ !inputs.contract-only }}
        run: npm ci

      # 复用仓库既有命令，不另建测试体系。
      - name: Static source check
        if: ${{ !inputs.contract-only }}
        run: npm run test:static

      # 这里只跑 YuanHub 仓库内可独立执行的 node:test。
      # 跨端契约由下方 test:contract 检查；test:all 仍只覆盖前端。
      - name: Repository tests
        if: ${{ !inputs.contract-only }}
        run: npm run test:repo

      - name: Behavior tests
        if: ${{ inputs.behavior && !inputs.contract-only }}
        run: npm run test:behavior

      - name: Paired API contract
        run: npm run test:contract

      - name: Build
        if: ${{ !inputs.contract-only }}
        env:
          NODE_ENV: production
          YUANHUB_VERSION: ${{ inputs.release-version }}
          VITE_API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
        run: npm run build

      # 校验 VERSION / commit / buildTime 确实进入了构建产物，
      # 否则版本入口与 Feedback 诊断会在线上显示错误信息。
      - name: Verify injected build info
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        if: ${{ !inputs.contract-only }}
        run: |
          set -eu
          version="${RELEASE_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          test -n "$version" || { echo "::error::VERSION is empty"; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          if ! grep -rqF "$version" dist/assets; then
            echo "::error::productVersion $version was not found in the built assets"
            exit 1
          fi
          python3 - "$version" "$RELEASE_COMMIT" <<'PYVERIFY'
          import json, sys
          info = json.load(open("dist/build-info.json"))
          assert info["productVersion"] == sys.argv[1]
          assert info["frontendCommit"] == sys.argv[2]
          PYVERIFY
          test -f dist/sw.js
          echo "Injected productVersion: $version"

      - name: Upload build output
        if: ${{ !inputs.contract-only }}
        uses: actions/upload-artifact@v4
        with:
          name: yuanhub-dist-${{ inputs.commit || github.sha }}-${{ github.run_attempt }}
          path: frontend/dist
          retention-days: 7
