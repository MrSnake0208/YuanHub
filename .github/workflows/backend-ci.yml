name: Backend CI

# 本工作流供手动或集中发布检查复用；Push/PR 轻量检查由 ci.yml 自动运行。

on:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ""
      release-version:
        type: string
        default: ""
      artifact-only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to diagnose
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-yuanhub-backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

permissions:
  contents: read

jobs:
  build:
    name: Backend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 复用仓库既有命令，不重新发明测试体系。
      - name: Lint, unit tests and build jar
        if: ${{ !inputs.artifact-only }}
        env:
          YUANHUB_BACKEND_VERSION: ${{ inputs.release-version }}
        run: ./gradlew ktlintCheck test assemble --console=plain

      - name: Build release jar only
        if: ${{ inputs.artifact-only }}
        env:
          YUANHUB_BACKEND_VERSION: ${{ inputs.release-version }}
        run: ./gradlew assemble --console=plain

      - name: Verify jar output
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -eu
          jar="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$jar" || { echo "::error::no bootJar produced"; exit 1; }
          python3 - "$jar" "$RELEASE_COMMIT" "${RELEASE_VERSION:-0.1.0-SNAPSHOT}" <<'PYVERIFY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              git = jar.read('BOOT-INF/classes/git.properties').decode().splitlines()
              build = jar.read('META-INF/build-info.properties').decode().splitlines()
          assert 'git.commit.id=' + sys.argv[2] in git
          assert 'build.version=' + sys.argv[3] in build
          PYVERIFY
          echo "Built $jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuanhub-backend-jar-${{ inputs.commit || github.sha }}-${{ github.run_attempt }}
          path: backend/build/libs/*.jar
          retention-days: 7
