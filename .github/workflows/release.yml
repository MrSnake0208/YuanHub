name: Release

# 生产发布：仅由 v* tag 触发，普通 push 不会部署。
# 发布前强制校验 VERSION 与 tag 完全一致，不一致立即停止。
#
# 普通 CI 继续使用 GitHub-hosted runner；Release 通过 SSH 驱动服务器 A：
#   服务器缓存源码 → checkout 精确 tag/commit → npm ci/build → 原子切换 current。
# 不再从 GitHub Runner SCP 整套 dist，避免大体积静态资源反复跨网传输。
#
# SSH 连接继续复用服务器 A 的既有凭据：
#   secrets.YUANHUB_PROMO_VPS_SSH_KEY / _HOST / _USER / _PORT
# 本应用专属 Variables：
#   YUANHUB_FRONTEND_DEPLOY_DIR / YUANHUB_FRONTEND_URL /
#   YUANHUB_FRONTEND_API_BASE / YUANHUB_KEEP_RELEASES
#
# 部署形态：
#   $YUANHUB_FRONTEND_DEPLOY_DIR/.source                  ← 服务器源码缓存
#   $YUANHUB_FRONTEND_DEPLOY_DIR/releases/<version>/      ← 每次发布一个完整构建
#   $YUANHUB_FRONTEND_DEPLOY_DIR/current -> releases/<version>
# Web 服务器（nginx 等）的 root 应指向 .../current。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在 tag（例如 v0.0.1-beta.2）"
        required: true

concurrency:
  group: yuanhub-frontend-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 与 promo 部署同一目标机；若给该 environment 配 Required reviewers，可让发布需人工批准。
    environment: production

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      # 关键闸门：VERSION 去掉前缀后必须与 tag 完全一致，否则不发布。
      - name: Verify VERSION matches tag
        run: |
          set -eu
          version="$(tr -d '[:space:]' < VERSION)"
          expected="${RELEASE_TAG#v}"
          test -n "$version" || { echo "::error::VERSION is empty"; exit 1; }
          if [ "$version" != "$expected" ]; then
            echo "::error::VERSION ($version) does not match tag $RELEASE_TAG (expected $expected). Refusing to publish."
            exit 1
          fi
          release_commit="$(git rev-parse HEAD)"
          echo "VERSION matches tag: $version"
          echo "YUANHUB_VERSION=$version" >> "$GITHUB_ENV"
          echo "YUANHUB_RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static source check
        run: npm run test:static

      # Release 与独立 CI 保持同一仓库边界：不读取相邻后端仓库。
      - name: Repository tests
        run: npm run test:repo


      - name: Validate deployment configuration
        env:
          FRONTEND_ROOT: ${{ vars.YUANHUB_FRONTEND_DEPLOY_DIR }}
          FRONTEND_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
          API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
          PROMO_ROOT: ${{ secrets.YUANHUB_PROMO_DEPLOY_DIR }}
        run: |
          set -eu
          test -n "$FRONTEND_ROOT" || { echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR is not configured"; exit 1; }
          test "$FRONTEND_ROOT" != "/" || { echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR must not be /"; exit 1; }
          case "$FRONTEND_ROOT" in
            /*) ;;
            *) echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR must be an absolute path"; exit 1 ;;
          esac
          test -n "$FRONTEND_URL" || { echo "::error::YUANHUB_FRONTEND_URL is not configured"; exit 1; }
          case "$FRONTEND_URL" in
            https://*) ;;
            *) echo "::error::YUANHUB_FRONTEND_URL must use https://"; exit 1 ;;
          esac
          test -n "$API_BASE" || { echo "::error::YUANHUB_FRONTEND_API_BASE is not configured"; exit 1; }
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::YUANHUB_FRONTEND_API_BASE must use https://"; exit 1 ;;
          esac
          if [ -n "$PROMO_ROOT" ] && [ "$FRONTEND_ROOT" = "$PROMO_ROOT" ]; then
            echo "::error::YUANHUB_FRONTEND_DEPLOY_DIR must differ from YUANHUB_PROMO_DEPLOY_DIR"
            exit 1
          fi

      - name: Validate deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.YUANHUB_PROMO_VPS_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" || {
            echo "::error::YUANHUB_PROMO_VPS_SSH_KEY is empty or unavailable. It is the same secret used by promo-site-deploy.yml."
            exit 1
          }
          case "$DEPLOY_KEY" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*|"-----BEGIN RSA PRIVATE KEY-----"*) ;;
            *)
              echo "::error::YUANHUB_PROMO_VPS_SSH_KEY must contain the complete private key, including BEGIN and END lines."
              exit 1
              ;;
          esac
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Build and activate release on server
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          FRONTEND_ROOT: ${{ vars.YUANHUB_FRONTEND_DEPLOY_DIR }}
          RELEASE_VERSION: ${{ env.YUANHUB_VERSION }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_COMMIT: ${{ env.YUANHUB_RELEASE_COMMIT }}
          API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
          KEEP_RELEASES: ${{ vars.YUANHUB_KEEP_RELEASES }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.YUANHUB_PROMO_VPS_HOST }}
          username: ${{ secrets.YUANHUB_PROMO_VPS_USER }}
          key: ${{ secrets.YUANHUB_PROMO_VPS_SSH_KEY }}
          port: ${{ secrets.YUANHUB_PROMO_VPS_PORT }}
          envs: FRONTEND_ROOT,RELEASE_VERSION,RELEASE_TAG,RELEASE_COMMIT,API_BASE,KEEP_RELEASES,REPO_URL
          command_timeout: 30m
          script: |
            set -eu

            test -n "$FRONTEND_ROOT"
            test -n "$RELEASE_VERSION"
            test -n "$RELEASE_TAG"
            test -n "$RELEASE_COMMIT"
            test -n "$API_BASE"
            test -n "$REPO_URL"

            release_dir="$FRONTEND_ROOT/releases/$RELEASE_VERSION"
            meta_file="$release_dir/deploy-meta.json"
            expected_link="releases/$RELEASE_VERSION"
            mkdir -p "$FRONTEND_ROOT/releases"

            # 同一 tag/commit 已完整发布时直接复用，支持安全重跑。
            reuse_release=0
            if [ -f "$meta_file" ] &&
               grep -qF "\"version\":\"$RELEASE_VERSION\"" "$meta_file" &&
               grep -qF "\"commit\":\"$RELEASE_COMMIT\"" "$meta_file"; then
              reuse_release=1
              echo "Reusing existing release: $release_dir"
            fi

            if [ "$reuse_release" -ne 1 ]; then
              for tool in git node npm; do
                command -v "$tool" >/dev/null 2>&1 || {
                  echo "$tool is required on the deployment server"
                  exit 1
                }
              done

              node_major="$(node -p 'process.versions.node.split(".")[0]')"
              if [ "$node_major" != "22" ]; then
                echo "Node.js 22 is required on the deployment server; found $(node --version)"
                exit 1
              fi

              source_dir="$FRONTEND_ROOT/.source"
              if [ ! -d "$source_dir/.git" ]; then
                rm -rf "$source_dir"
                git clone --filter=blob:none "$REPO_URL" "$source_dir"
              fi

              cd "$source_dir"
              git remote set-url origin "$REPO_URL"
              git fetch --force --prune --tags origin
              git checkout --detach "$RELEASE_TAG"
              git reset --hard "$RELEASE_TAG"

              actual_commit="$(git rev-parse HEAD)"
              if [ "$actual_commit" != "$RELEASE_COMMIT" ]; then
                echo "Checked-out commit $actual_commit does not match expected $RELEASE_COMMIT"
                exit 1
              fi

              # 清掉上一次构建残留；npm 下载缓存仍保留在部署用户主目录。
              git clean -ffdx
              npm ci --no-audit --no-fund
              VITE_API_BASE="$API_BASE" npm run build

              test -f dist/index.html || {
                echo "dist/index.html missing after server build"
                exit 1
              }
              test -n "$(ls -A dist/assets)" || {
                echo "dist/assets is empty after server build"
                exit 1
              }
              if ! grep -rqF "$RELEASE_VERSION" dist/assets; then
                echo "productVersion $RELEASE_VERSION missing from server build"
                exit 1
              fi

              stage_dir="$FRONTEND_ROOT/releases/.${RELEASE_VERSION}.tmp"
              rm -rf "$stage_dir"
              mkdir -p "$stage_dir"
              cp -a dist/. "$stage_dir/"
              printf '{"version":"%s","tag":"%s","commit":"%s"}\n' \
                "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" \
                > "$stage_dir/deploy-meta.json"

              active_target="$(readlink "$FRONTEND_ROOT/current" 2>/dev/null || true)"
              if [ "$active_target" = "$expected_link" ] && [ -d "$release_dir" ]; then
                echo "Refusing to replace the currently active release in place: $release_dir"
                exit 1
              fi

              rm -rf "$release_dir"
              mv "$stage_dir" "$release_dir"
            fi

            # 临时链接 + rename，保证 current 始终指向完整 release。
            ln -sfn "$expected_link" "$FRONTEND_ROOT/.current-tmp"
            mv -T "$FRONTEND_ROOT/.current-tmp" "$FRONTEND_ROOT/current"
            echo "current -> $(readlink "$FRONTEND_ROOT/current")"

            keep="${KEEP_RELEASES:-5}"
            case "$keep" in
              ''|*[!0-9]*) keep=5 ;;
            esac
            if [ "$keep" -gt 0 ]; then
              cd "$FRONTEND_ROOT/releases"
              ls -1dt -- */ 2>/dev/null | tail -n "+$((keep + 1))" | while read -r old; do
                case "$old" in
                  "$RELEASE_VERSION"/*) continue ;;
                esac
                rm -rf -- "$old"
              done
            fi

      - name: Health check
        env:
          SITE_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
          EXPECTED_VERSION: ${{ env.YUANHUB_VERSION }}
          EXPECTED_COMMIT: ${{ env.YUANHUB_RELEASE_COMMIT }}
        run: |
          set -eu
          test -n "$SITE_URL" || { echo "::error::YUANHUB_FRONTEND_URL is not configured"; exit 1; }
          base="${SITE_URL%/}"
          attempt=1
          while [ "$attempt" -le 10 ]; do
            payload="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${base}/deploy-meta.json?deploy=${EXPECTED_COMMIT}" || true)"
            version="$(printf '%s' "$payload" | jq -r '.version // ""' 2>/dev/null || true)"
            commit="$(printf '%s' "$payload" | jq -r '.commit // ""' 2>/dev/null || true)"
            if [ "$version" = "$EXPECTED_VERSION" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Health check passed: version=$version commit=${commit::7}"
              exit 0
            fi
            echo "Attempt $attempt: version='$version' commit='${commit:0:7}'"
            attempt=$((attempt + 1))
            sleep 6
          done
          echo "::error::Health check failed: $base is not serving version=$EXPECTED_VERSION commit=$EXPECTED_COMMIT"
          exit 1

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_URL: ${{ vars.YUANHUB_FRONTEND_URL }}
        run: |
          set -eu
          notes="$(mktemp)"
          {
            echo "## YuanHub ${RELEASE_TAG}"
            echo
            echo "- productVersion: \`${YUANHUB_VERSION}\`"
            echo "- frontendCommit: \`${YUANHUB_RELEASE_COMMIT::7}\`"
            echo "- deployedTo: \`${FRONTEND_URL}\`"
            echo
            echo "更新日志见 ${FRONTEND_URL%/}/changelog"
          } > "$notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "YuanHub $RELEASE_TAG" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --title "YuanHub $RELEASE_TAG" \
              --notes-file "$notes" \
              --verify-tag
          fi
