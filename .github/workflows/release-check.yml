name: Release checks
run-name: Check ${{ inputs.commit }} [${{ inputs.request }}]

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Frozen full main SHA
        required: true
      frontend_version:
        description: Frontend version (empty means do not deploy frontend)
      backend_version:
        description: Backend version (empty means do not deploy backend)
      stress:
        description: Include scale-sensitive backend checks
        type: boolean
        default: false
      baselines:
        description: Current production component version and full SHA (JSON)
        required: true
      request:
        description: Unique candidate identifier
        required: true

permissions:
  contents: read

concurrency:
  group: release-check-${{ inputs.commit }}-${{ inputs.request }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen candidate
        env:
          CANDIDATE: ${{ inputs.commit }}
          FRONTEND: ${{ inputs.frontend_version }}
          BACKEND: ${{ inputs.backend_version }}
          REQUEST: ${{ inputs.request }}
          BASELINES: ${{ inputs.baselines }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from scripts.release_gate import command, version
          sha = os.environ['CANDIDATE']
          assert re.fullmatch('[0-9a-f]{40}', sha), 'full SHA required'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_SHA'] == sha == command('git', 'rev-parse', 'HEAD'), 'main moved; prepare again'
          assert re.fullmatch('[a-f0-9]{32}', os.environ['REQUEST'])
          assert os.environ['FRONTEND'] or os.environ['BACKEND'], 'no component selected'
          baselines = json.loads(os.environ['BASELINES'])
          assert set(baselines) == {'frontend', 'backend'}
          for baseline in baselines.values():
              version(baseline['version'])
              assert re.fullmatch('[0-9a-f]{40}', baseline['commit'])
              command('git', 'merge-base', '--is-ancestor', baseline['commit'], sha)
          for key in ('FRONTEND', 'BACKEND'):
              if os.environ[key]:
                  assert version(os.environ[key]) == os.environ[key]
          PY
      - name: Release infrastructure regressions
        run: python3 -m unittest scripts.testing.test_monorepo_ci scripts.testing.test_monorepo_release scripts.testing.test_artifact_deploy scripts.testing.test_server_prebuild

  frontend:
    needs: candidate
    uses: ./.github/workflows/frontend-ci.yml
    with:
      commit: ${{ inputs.commit }}
      release-version: ${{ inputs.frontend_version }}

  backend:
    needs: candidate
    uses: ./.github/workflows/backend-ci.yml
    with:
      commit: ${{ inputs.commit }}
      release-version: ${{ inputs.backend_version }}

  regression:
    needs: candidate
    uses: ./.github/workflows/frontend-regression.yml
    with:
      commit: ${{ inputs.commit }}

  safety:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Disposable runner Mongo replica set
        run: |
          docker run -d --name release-mongo --network host --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" mongo:7 --replSet rs0 --bind_ip_all
          for n in $(seq 1 30); do
            if docker exec release-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 2
          done
          docker exec release-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for n in $(seq 1 30); do
            if docker exec release-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)'; then break; fi
            sleep 2
          done
          docker exec release-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)'
          mkdir -p .dev/bin
          cat > .dev/bin/mongosh <<'SH'
          #!/bin/sh
          exec docker exec -i -w "$(pwd)" -e YUANHUB_REPAIR_ACTION -e YUANHUB_REPAIR_REVISION release-mongo mongosh "$@"
          SH
          chmod +x .dev/bin/mongosh
          echo "$GITHUB_WORKSPACE/.dev/bin" >> "$GITHUB_PATH"
      - name: Isolation, persistence, migration, schema and architecture
        working-directory: backend
        run: ./gradlew integrationTest apiSchemaTest architectureTest realisticTest --console=plain
      - name: Optional scale checks
        if: inputs.stress
        working-directory: backend
        run: ./gradlew stressTest --console=plain
      - name: Backend script regressions
        env:
          BETA_TEST_MONGO_URI: mongodb://127.0.0.1:27017/yuanhub_test_beta_runner?replicaSet=rs0&directConnection=true
        working-directory: backend
        run: |
          node --test scripts/migrations/20260907-level-catalog.test.js scripts/migrations/20261015-recruitment-duplicate-pools.test.js
          npm ci --prefix scripts/beta --no-audit --no-fund
          npm test --prefix scripts/beta
      - name: Save safety reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/test-results/
            backend/build/reports/tests/
          retention-days: 7

  gate:
    if: always()
    needs: [candidate, frontend, backend, regression, safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Require all checks and record evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
          SHA: ${{ inputs.commit }}
          FRONTEND: ${{ inputs.frontend_version }}
          BACKEND: ${{ inputs.backend_version }}
          STRESS: ${{ inputs.stress }}
          API_BASE: ${{ vars.YUANHUB_FRONTEND_API_BASE }}
          BASELINES: ${{ inputs.baselines }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'candidate', 'frontend', 'backend', 'regression', 'safety'}
          assert all(v['result'] == 'success' for v in results.values()), results
          manifest = dict(sha=os.environ['SHA'], run_id=int(os.environ['GITHUB_RUN_ID']),
                          attempt=int(os.environ['GITHUB_RUN_ATTEMPT']), checks='complete',
                          versions=dict(frontend=os.environ['FRONTEND'], backend=os.environ['BACKEND']),
                          stress=os.environ['STRESS'] == 'true', frontend_api_base=os.environ['API_BASE'],
                          baselines=json.loads(os.environ['BASELINES']))
          Path('candidate.json').write_text(json.dumps(manifest, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Frozen release evidence\n```json\n' + json.dumps(manifest, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 7
